name: Android APK

# Builds the Android app with Capacitor from www/.
# On main, with the signing secrets set, it publishes a signed APK as a GitHub Release.
# Other branches (and builds without the secrets) produce a debug APK as a workflow artifact only.
on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'www/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Generate the Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#6b4eff' --iconBackgroundColorDark '#6b4eff' --splashBackgroundColor '#f5f5fa' --splashBackgroundColorDark '#0d0f14'
          npx cap sync android

      - name: Set the version
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Build signed release APK
        if: env.HAS_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          npx cap build android --androidreleasetype APK --signing-type apksigner \
            --keystorepath "$RUNNER_TEMP/release.jks" --keystorepass "$ANDROID_KEYSTORE_PASSWORD" \
            --keystorealias "$ANDROID_KEY_ALIAS" --keystorealiaspass "$ANDROID_KEY_PASSWORD"
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir -p dist
          cp "$(find android/app/build/outputs/apk/release -name '*-signed.apk' | head -n1)" "dist/wealth-tracker-${VERSION}.apk"

      - name: Build debug APK (no signing key set)
        if: env.HAS_KEY != 'true'
        run: |
          echo "::warning::No signing secrets, so this is a debug build. Debug builds can't be installed over a signed one."
          (cd android && ./gradlew --no-daemon assembleDebug)
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/wealth-tracker-${VERSION}-debug.apk"

      - name: Check the APK signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner"
          "$APKSIGNER" verify --verbose --print-certs dist/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wealth-tracker-${{ env.VERSION }}
          path: dist/*.apk

      - name: Publish a release
        if: github.ref == 'refs/heads/main' && env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Wealth Tracker ${{ env.VERSION }}
          body: |
            Android app built from ${{ github.sha }}.
            Download the .apk below on your phone and open it to install or update.
          files: dist/*.apk
